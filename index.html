<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solus</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="header container">
      <nav class="header-left-menu">
        <ul class="header-left-menu-list">
          <li class="header-left-menu-item">
            <a class="header-left-menu-link" href="/">Home</a>
          </li>
          <li class="header-left-menu-item">
            <a class="header-left-menu-link" href="/">About</a>
          </li>
          <li class="header-left-menu-item">
            <a class="header-left-menu-link" href="/">Services</a>
          </li>
        </ul>
      </nav>
      <a class="header-logo" href="/">
        <img
          class="header-logo-image"
          src="./images/logo.svg"
          alt="Solus Logo"
          width="134" height="36"
        />
      </a>
      <nav class="header-right-menu">
        <ul class="header-right-menu-list">
          <li class="header-right-menu-item">
            <a class="header-right-menu-link" href="/">Therapists</a>
          </li>
          <li class="header-right-menu-item">
            <a class="header-right-menu-link" href="/">Resources</a>
          </li>
          <li class="header-right-menu-item">
            <a class="header-right-menu-link" href="/">Contact</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="content">
      <h1 class="visually-hidden">Solus – Mental Health & Wellness</h1>
      <section class="section container">
        <div class="hero">
          <h2 class="hero-title h1">Support for Your Mental Well-being</h2>
          <p class="hero-description">
            Connect with licensed therapists, counselors, and wellness coaches to support your journey.
          </p>
          <button class="hero-button button" type="button">Get Started</button>
        </div>
      </section>
    </main>

</html>
